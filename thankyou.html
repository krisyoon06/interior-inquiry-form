<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문의 접수 완료</title>
<style>
  :root {
    --page-bg: #f5f4f1;
    --card-bg: #ffffff;
    --text: #2b2825;
    --text-dim: #8a8580;
    --accent: #a97c50;
    --accent-hover: #8f6841;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 56px 32px;
    text-align: center;
  }

  .check-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #f6ede3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-icon svg {
    width: 30px;
    height: 30px;
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 10px;
    line-height: 1.5;
  }

  p {
    font-size: 14.5px;
    color: var(--text-dim);
    line-height: 1.6;
    margin: 0 0 32px;
  }

  .btn-home {
    display: inline-block;
    padding: 13px 28px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: background .15s;
  }

  .btn-home:hover {
    background: var(--accent-hover);
  }

  .site-footer {
    margin: 24px 0 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a97c50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5" />
      </svg>
    </div>
    <h1>감사합니다.<br>문의가 접수되었어요.</h1>
    <p>담당자가 확인 후 순차적으로 연락드리겠습니다 :)</p>
    <!-- TODO: "접수 이후 단계 알아보기" 페이지 만들면 href 연결 -->
    <span class="btn-home">접수 이후 단계 알아보기</span>
    <footer class="site-footer">© 2026 LLL SPACE. All rights reserved.</footer>
  </div>
</body>
</html>
